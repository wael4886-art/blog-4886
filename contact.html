<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Get in Touch</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="posts.html">Posts</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main>
        <article class="contact-panel">
            <h2>Connect with the club</h2>
            <table>
                <caption>Our communication channels</caption>
                <thead>
                    <tr>
                        <th scope="col">Channel</th>
                        <th scope="col">Visit or contact</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">Email</th>
                        <td><a href="mailto:hello@techclub.example">hello@techclub.example</a></td>
                    </tr>
                    <tr>
                        <th scope="row">Facebook</th>
                        <td><a href="https://www.facebook.com/">Visit Facebook</a></td>
                    </tr>
                    <tr>
                        <th scope="row">Instagram</th>
                        <td><a href="https://www.instagram.com/">Visit Instagram</a></td>
                    </tr>
                    <tr>
                        <th scope="row">GitHub</th>
                        <td><a href="https://github.com/">Visit GitHub</a></td>
                    </tr>
                </tbody>
            </table>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 Tech Club</p>
    </footer>

</body>
</html>
